title: linuxmd
description: Media informasi Linux — berita, panduan, dan kupasan mendalam soal cara kerja Linux sesungguhnya.
url: https://linuxmd.id
lang: id-ID
theme: jekyll-theme-hacker

show_downloads: false

# Menu navigasi yang tampil di header setiap halaman
nav:
  - title: Beranda
    url: /
  - title: Artikel
    url: /artikel/
  - title: Kontribusi
    url: /kontribusi/
  - title: Tentang
    url: /tentang/

# Gambar preview default saat link dibagikan (og:image), dipakai
# kalau sebuah halaman/artikel tidak set `image` sendiri di front matter
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og/default.png

# Build settings
markdown: kramdown
permalink: /artikel/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
