title: linuxmd
description: Media informasi Linux — berita, panduan, dan kupasan mendalam soal cara kerja Linux sesungguhnya.
lang: id-ID
theme: jekyll-theme-hacker

show_downloads: false

# Menu navigasi yang tampil di header setiap halaman
nav:
  - title: Beranda
    url: /
  - title: Artikel
    url: /artikel/
  - title: Tentang
    url: /tentang/

# Build settings
markdown: kramdown
permalink: /artikel/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
