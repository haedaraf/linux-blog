<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .mono { font-family: Monaco, "Bitstream Vera Sans Mono", "Lucida Console", Menlo, Consolas, monospace; }
      .green { fill: #b5e853; }
      .dim { fill: #6a8f3a; }
      .grey { fill: #aaa; }
      .faint { fill: #666; }
    </style>
    <radialGradient id="glow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1c2b0e" />
      <stop offset="100%" stop-color="#151515" />
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent" />
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-opacity="0.02" />
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#scan)" />

  <!-- terminal window -->
  <g transform="translate(60,60)">
    <rect width="620" height="470" rx="8" fill="#0f0f0f" stroke="#333" stroke-width="1.5" />
    <rect width="620" height="34" rx="8" fill="#1c1c1c" />
    <rect y="26" width="620" height="8" fill="#1c1c1c" />
    <circle cx="20" cy="17" r="6" fill="#ac4142" />
    <circle cx="42" cy="17" r="6" fill="#f4bf75" />
    <circle cx="64" cy="17" r="6" fill="#90a959" />
    <text x="310" y="21" text-anchor="middle" class="mono faint" font-size="12">root@host: ~</text>

    <g class="mono" font-size="15">
      <text x="22" y="68" class="green">$</text>
      <text x="40" y="68" class="grey">unshare --uts --pid --mount --fork /bin/bash</text>

      <text x="22" y="96" class="green">$</text>
      <text x="40" y="96" class="grey">ps aux</text>
      <text x="40" y="118" class="dim">PID   USER   COMMAND</text>
      <text x="40" y="138" class="dim">1     root   /bin/bash</text>

      <text x="22" y="172" class="green">$</text>
      <text x="40" y="172" class="grey">cat /sys/fs/cgroup/.../memory.max</text>
      <text x="40" y="194" class="dim">536870912</text>

      <text x="22" y="228" class="green">$</text>
      <text x="40" y="228" class="grey">cat /sys/fs/cgroup/.../cpu.max</text>
      <text x="40" y="250" class="dim">150000 100000</text>

      <text x="22" y="284" class="green">$</text>
      <text x="40" y="284" class="grey">_</text>
    </g>

    <!-- namespace / cgroup mini diagram -->
    <g transform="translate(22,330)" class="mono" font-size="12">
      <rect x="0" y="0" width="576" height="118" rx="6" fill="none" stroke="#333" />
      <text x="12" y="20" class="faint">kernel</text>

      <rect x="16" y="34" width="256" height="66" rx="4" fill="none" stroke="#b5e853" stroke-opacity="0.6" />
      <text x="28" y="54" class="green">namespace</text>
      <text x="28" y="74" class="grey" font-size="11">apa yang boleh dilihat</text>
      <text x="28" y="90" class="faint" font-size="11">pid · net · mnt · uts · ipc · user</text>

      <rect x="292" y="34" width="268" height="66" rx="4" fill="none" stroke="#b5e853" stroke-opacity="0.6" />
      <text x="304" y="54" class="green">cgroup</text>
      <text x="304" y="74" class="grey" font-size="11">apa yang boleh dipakai</text>
      <text x="304" y="90" class="faint" font-size="11">cpu · memory · io · pids</text>
    </g>
  </g>

  <!-- title -->
  <g transform="translate(720,120)" class="mono">
    <text x="0" y="0" class="faint" font-size="16">./ linuxmd</text>

    <text x="0" y="70" class="green" font-size="42" font-weight="bold">Namespace</text>
    <text x="0" y="118" class="green" font-size="42" font-weight="bold">&amp; Cgroup</text>

    <text x="0" y="168" class="grey" font-size="20">Di balik Docker &amp; Kubernetes,</text>
    <text x="0" y="196" class="grey" font-size="20">sebenarnya cuma dua hal ini.</text>

    <rect x="0" y="230" width="380" height="1" fill="#333" />

    <text x="0" y="264" class="faint" font-size="14">Tidak ada hypervisor.</text>
    <text x="0" y="286" class="faint" font-size="14">Tidak ada &quot;mode container&quot; di kernel.</text>
    <text x="0" y="308" class="faint" font-size="14">Cuma proses biasa, dibungkus rapi.</text>
  </g>
</svg>
